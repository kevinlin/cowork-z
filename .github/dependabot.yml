version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri-js:
        patterns:
          - "@tauri-apps/*"
      dev-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /src-tauri/sidecar-opencode
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      tauri-rust:
        patterns:
          - tauri
          - tauri-*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

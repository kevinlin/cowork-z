name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install sidecar dependencies
        run: pnpm install --ignore-workspace
        working-directory: src-tauri/sidecar-opencode

      - name: Run frontend lint and tests
        run: pnpm ultracite:check & pnpm test --run

      - name: Run sidecar tests
        run: pnpm test
        working-directory: src-tauri/sidecar-opencode

      - name: Build sidecar binary for Linux ARM64
        run: pnpm build:binary
        working-directory: src-tauri/sidecar-opencode

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri

name: Build
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install sidecar dependencies
        run: pnpm install --ignore-workspace
        working-directory: src-tauri/sidecar-opencode

      - name: Run frontend lint
        run: pnpm ultracite:check

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test --run

      - name: Build frontend (production)
        run: pnpm build

      - name: Run sidecar tests
        run: pnpm test
        working-directory: src-tauri/sidecar-opencode

      - name: Build sidecar binary (Linux ARM64)
        if: runner.os == 'Linux'
        run: pnpm build:binary:linux-arm64
        working-directory: src-tauri/sidecar-opencode

      - name: Build sidecar binary (macOS ARM64)
        if: runner.os == 'macOS'
        run: pnpm build:binary
        working-directory: src-tauri/sidecar-opencode

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri
